name: MovieMind CI

on:
  push:
    branches: [ main, v2-global, ci-fix ]
  pull_request:
    branches: [ main, v2-global ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache IMDb raw datasets
        uses: actions/cache@v4
        with:
          path: /tmp/imdb_cache
          key: imdb-raw-${{ hashFiles('scripts/build_catalog.py') }}-${{ hashFiles('artifacts/wikidata_cache.json') }}
          restore-keys: |
            imdb-raw-${{ hashFiles('scripts/build_catalog.py') }}-
            imdb-raw-

      - name: Build World Cinema Catalog and Derived Artifacts
        run: |
          mkdir -p /tmp/imdb_cache
          python scripts/build_catalog.py --tmp-dir /tmp/imdb_cache
          python scripts/build_global_tfidf.py

      - name: Run Pytest Suite
        run: |
          pytest -v -m "not network"

      - name: Verify Evaluation Ablation Run
        run: |
          python src/evaluate.py
